#cloud-config
# First-boot provisioning for a Paperclip VM (Ubuntu 22.04/24.04).
#
# This is a template: the __*_B64__ placeholders are replaced with
# base64-encoded file contents by scripts/aws/deploy-ec2.sh before being passed
# as instance user data. To use it by hand, replace them yourself:
#
#   base64 -w0 docker/vm/docker-compose.yml   # -> __DOCKER_COMPOSE_B64__
#   base64 -w0 docker/vm/Caddyfile            # -> __CADDYFILE_B64__
#   base64 -w0 your-filled-in-.env            # -> __ENV_B64__
#
package_update: true
packages:
  - ca-certificates
  - curl

# Small swap file so occasional agent-load spikes degrade gracefully instead of
# OOM-killing the server on a 2-4 GiB instance.
swap:
  filename: /swapfile
  size: "2G"
  maxsize: "2G"

write_files:
  - path: /opt/paperclip/docker-compose.yml
    encoding: b64
    content: __DOCKER_COMPOSE_B64__
    permissions: "0644"
  - path: /opt/paperclip/Caddyfile
    encoding: b64
    content: __CADDYFILE_B64__
    permissions: "0644"
  - path: /opt/paperclip/.env
    encoding: b64
    content: __ENV_B64__
    permissions: "0600"

runcmd:
  # Docker CE + compose plugin from Docker's official repo (distro packages can
  # lag behind the BuildKit/compose features the stack expects).
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - cd /opt/paperclip && docker compose pull && docker compose up -d

final_message: "Paperclip stack is starting; give it a couple of minutes on first boot. Data: cloud-init finished after $UPTIME seconds."
